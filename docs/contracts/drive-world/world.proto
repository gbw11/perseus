// SPDX-License-Identifier: Apache-2.0
// Shared provider profiles: legacy drive-world-1 and drive-parking-2.
// World remains major1/minor2 with features11/15 for drive-parking-2.
// DriveState/DriveLink use major2; nested major1 messages retain their versions.
// Required presence is deliberate; zero is not omission or motion authority.
syntax = "proto2";
package xenova.drive;

message Pose { required float x = 1; required float y = 2; required float yaw = 3; }
message Point { required float x = 1; required float y = 2; }
message PathPoint {
  required Pose pose = 1;
  required float steering_rad = 2;
  required float velocity_mps = 3;
}
message WorldSnapshot {
  required uint32 major = 1;
  required uint32 minor = 2;
  required uint32 required_features = 3;
  required string vehicle = 4;
  required string mapper_boot = 5;
  required string mapper_instance = 6;
  required string map_epoch = 7;
  required string frame_epoch = 8;
  required string odom_epoch = 9;
  required uint64 sequence = 10;
  required string configuration = 11;
  required string calibration = 12;
  required string primitive = 13;
  required string reference_id = 14;
  required uint64 reference_revision = 15;
  required Pose origin = 16;
  required float resolution_m = 17;
  required uint32 width = 18;
  required uint32 height = 19;
  required uint64 reference_odom_seq = 20;
  required Pose reference_vehicle_pose = 21;
  required uint64 observed_us = 22;
  required uint64 completed_us = 23;
  required uint64 published_us = 24;
  required uint64 observation_seq = 25;
  required string clock_epoch = 26;
  // row-major: occupancy 0..100 or 255 unknown. Flags bit0 valid, bit1
  // statically retained, bit2 expired. required_features bit0 enables road
  // priority: cell_flags bit3 marks cell centers in the preferred road.
  // It never makes invalid/occupied/expired cells traversable.
  // age_le32 is original age in milliseconds.
  required bytes occupancy = 27;
  required bytes cell_flags = 28;
  required bytes age_le32 = 29;
  repeated Point reference = 30;
  repeated Point left_boundary = 31;
  repeated Point right_boundary = 32;
  required bool complete = 33;
  required bool truncated = 34;
  required uint32 inflation_policy = 35; // 0: raw occupied cells; Pi adds footprint/margin.
  optional LaneModel lane_model = 36;
  repeated ParkingSlot parking_slots = 37;
  optional bytes drivable_permission = 38;
  optional MapLocalization localization = 39;
  optional SceneAdmissionRef scene = 40;
  optional ParkingSetMeta parking_set = 41;
}
message VehicleSample {
  required uint32 major = 1;
  required string vehicle = 2;
  required string host_boot = 3;
  required string device_session = 4;
  required string odom_epoch = 5;
  required uint64 sequence = 6;
  required uint64 source_sample = 7;
  required uint64 source_us = 8;
  required uint64 pi_sample_us = 9;
  required uint32 clock_error_us = 10;
  required sint64 left_ticks = 11;
  required sint64 right_ticks = 12;
  required Pose odom_pose = 13;
  required float velocity_mps = 14;
  optional float measured_steering_rad = 15;
  optional float estimated_steering_rad = 16;
  required float position_error_m = 17;
  required float heading_error_rad = 18;
  required uint32 quality = 19; // bit0 encoder valid, bit1 clock valid; other bits unsupported.
  required string calibration = 20;
  optional float steering_error_rad = 21;
  optional string gateway_instance = 22;
  optional string pi_session = 23;
}
message DriveState {
  required uint32 major = 1;
  required string source_vm = 2;
  required string source_execution = 3;
  required string source_app_instance = 4;
  required uint32 source_generation = 5;
  required uint64 state_revision = 6;
  required string frame_epoch = 7;
  required string odom_epoch = 8;
  required string configuration = 9;
  required string primitive = 10;
  required string reference_id = 11;
  required uint64 reference_revision = 12;
  required uint64 path_revision = 13;
  required uint64 maneuver_revision = 14;
  required sint32 direction = 15; // -1/right, 0/reference, +1/left
  required uint32 maneuver_phase = 16; // 0/reference, 1/bypass, 2/rejoin
  required Pose merge_goal = 17;
  required uint64 vehicle_sequence = 18;
  required uint64 calculation_sequence = 19;
  required uint32 tracker_index = 20;
  required bool complete = 21;
  repeated PathPoint path = 22;
  required string message_id = 23;
  required string calibration = 24;
  required string map_epoch = 25;
  required uint64 observation_seq = 26;
  // Present only after this maneuver's merge milestone was actually passed on
  // this reference revision. Absence is not proof of passage.
  optional uint64 merge_passed_reference_revision = 27;
  optional uint32 world_features = 28; // absent: legacy map semantics (0)
  optional uint32 state_features = 29; // drive-parking-2 requires semantic mask7.
  optional MissionExecution mission = 30;
  repeated GearSegment segments = 31;
  optional DirectionGateRef direction_gate = 32;
  // State feature8 binds the original lane intent and basis to this path snapshot.
  optional TaskReferenceState task_reference = 33;
  // Feature16 is opt-in; absence is not an authoritative NONE episode.
  optional EpisodeSnapshot episode = 34;
}
// Presence means both native intent.active and basis.bound. Parent reference/source
// fields retain their existing meanings; basis_revision is the original prefix's.
message TaskReferenceState {
  required fixed32 home_lane_id = 1;
  required fixed32 from_lane_id = 2;
  required fixed32 selected_lane_id = 3;
  required bool changing = 4;
  required uint64 basis_revision = 5;
  repeated Point basis_prefix = 6;
  required string vehicle = 7;
  required string mapper_boot = 8;
  required string mapper_instance = 9;
  required string clock_epoch = 10;
}
// Separate Pi state connection. These bounded management/state messages are
// not part of the small command/control JSON socket or the Jetson map client.
message ClockProbe {
  required string vm = 1;
  required string execution = 2;
  required string app_instance = 3;
  required uint64 sequence = 4;
  required uint64 guest_send_us = 5;
  optional GuestClockReceipt receipt = 6;
  // Capability only, not the presence mask of a particular DriveState.
  // Absence is legacy; authenticated peer and approved profile are also required.
  optional uint32 supported_state_features = 7;
}
// Receipt of one exact original stamped Reply; arrival does not renew its lease.
message GuestClockReceipt {
  required uint64 probe_sequence = 1;
  required bytes reply_sha256 = 2;
  required uint64 guest_receive_us = 3;
}
message WorldTrust {
  required string vehicle = 1;
  required string mapper_boot = 2;
  required string mapper_instance = 3;
  required string map_epoch = 4;
  required string frame_epoch = 5;
  required string odom_epoch = 6;
  required string configuration = 7;
  required string calibration = 8;
  required string primitive = 9;
  required string clock_epoch = 10;
  required sint64 lower_offset_us = 11; // mapper -> Pi clock interval
  required sint64 upper_offset_us = 12;
  required uint64 expires_pi_us = 13;
  required uint32 max_error_us = 14;
}
message ClockReply {
  required ClockProbe probe = 1;
  required string host_boot = 2;
  required string gateway_instance = 3;
  required uint64 pi_receive_us = 4;
  required uint64 pi_send_us = 5;
  optional WorldTrust trust = 6;
  required VehicleSample vehicle = 7;
  optional MissionGrant current_mission = 8;
  optional DirectionGateWitness direction_gate = 9;
  // Set only after Pi validates its original emitted Reply/P4 receipt. The Probe
  // echo is not an acknowledgement. VM promotes that prior clock, not this Reply.
  optional GuestClockReceipt accepted_receipt = 10;
  // Pi-owned expiry fixed before enqueue; send stamp/receipt/ACK never renew it.
  optional uint64 guest_clock_valid_until_pi_us = 11;
  optional EpisodeStatus episode_status = 12;
  optional DriveControlFacts control_facts = 13;
}
message AcceptedState {
  required string host_boot = 1;
  required string gateway_instance = 2;
  required DriveState state = 3;
}
message AppliedState {
  required string vm = 1;
  required string execution = 2;
  required string app_instance = 3;
  required string host_boot = 4;
  required string gateway_instance = 5;
  optional string copy_message_id = 6;
  required uint64 state_revision = 7;
  required string frame_epoch = 8;
  required string odom_epoch = 9;
  required string configuration = 10;
  required string calibration = 11;
  required string primitive = 12;
  required string reference_id = 13;
  required uint64 reference_revision = 14;
  required uint64 path_revision = 15;
  optional uint64 vehicle_sequence = 16;
  optional uint64 calculation_sequence = 17;
  required bool rebuilt = 18;
  required bool applied = 19;
  required uint64 maneuver_revision = 20;
  optional string reason = 21;
  required uint64 application_sequence = 22;
}
message DriveLink {
  required uint32 major = 1;
  oneof payload {
    ClockProbe probe = 2;
    ClockReply clock = 3;
    DriveState snapshot = 4;
    AcceptedState accepted = 5;
    AppliedState applied = 6;
    MissionGrant mission_grant = 7;
    MissionBudgetRequest budget_request = 8;
    MissionBudgetReply budget_reply = 9;
    // The original Pi SceneGrant, including revocation and original expiry.
    SceneGrant scene_grant = 10;
    EpisodeRequest episode_request = 11;
  }
}

// Registry core only: progress and the receipt are deliberately outside its SHA.
// state:0 UNKNOWN,1 NONE,2 ACTIVE. phase:0 FOLLOW,1 ASSESS,2 CHANGE_OUT,
// 3 PASS,4 REJOIN,5 FINISHED. FINISHED preserves the closed episode's original key.
message EpisodeCore {
  required uint32 state = 1;
  required bytes episode_id = 2;
  required uint64 revision = 3;
  required uint32 phase = 4;
  required uint64 phase_revision = 5;
  required fixed32 home_lane_id = 6;
  required fixed32 target_lane_id = 7;
  required uint32 policy = 8; // 0 inactive,1 RETURN_HOME,2 KEEP_TARGET.
  repeated Point blocker = 9; // Conservative original occupied hull; max8 vertices.
  required float blocker_position_bound_m = 10;
  required uint64 blocker_world_sequence = 11;
  required uint64 blocker_observation_sequence = 12;
  required bytes birth_snapshot_id = 13;
  required uint64 basis_revision = 14;
  required uint32 basis_prefix_count = 15;
  required bytes basis_prefix_sha256 = 16;
  required bytes source_geometry_sha256 = 17;
  required uint64 origin_vehicle_sequence = 18;
  required uint64 started_pi_us = 19;
  required uint64 deadline_pi_us = 20;
  required uint64 phase_started_pi_us = 21;
  required uint64 phase_deadline_pi_us = 22;
  required sint64 left_baseline_ticks = 23;
  required sint64 right_baseline_ticks = 24;
  required bytes meter_epoch = 25;
  required uint64 meter_baseline_total_ticks = 26;
  required float max_travel_m = 27;
  required uint32 progress_mode = 28; // 0 inactive,1 station lower,2 fixed-goal remaining.
  required Pose phase_goal = 29;
  required bool stop_wait = 30;
  required uint64 stop_wait_started_pi_us = 31;
}
message EpisodeProgress {
  required uint64 used_travel_ticks = 1;
  required uint64 last_progress_pi_us = 2;
  required uint64 vehicle_sequence = 3;
  required float station_lower_m = 4;
  required float remaining_upper_m = 5;
  required uint64 revision = 6;
}
message EpisodeAcceptanceRef {
  required bytes registry_epoch = 1;
  required uint64 registry_revision = 2;
  required bytes request_nonce = 3;
  required bytes request_sha256 = 4;
  required bytes accepted_core_sha256 = 5;
  required uint64 request_sequence = 6;
  required bytes origin_vm = 7;
  required bytes origin_execution = 8;
  required bytes origin_app_instance = 9;
  required uint32 origin_generation = 10;
  required uint64 origin_grant_revision = 11;
}
message EpisodeSnapshot {
  required EpisodeCore core = 1;
  required EpisodeProgress progress = 2;
  required EpisodeAcceptanceRef acceptance = 3;
}
// A request has no parent DriveState. These are the actual source geometry keys.
// A snapshot reuses the equivalent parent State/Task33 fields instead.
message EpisodeSourceContext {
  required string vehicle = 1;
  required string mapper_boot = 2;
  required string mapper_instance = 3;
  required string map_epoch = 4;
  required string frame_epoch = 5;
  required string odom_epoch = 6;
  required string clock_epoch = 7;
  required string configuration = 8;
  required string calibration = 9;
  required bytes primitive = 10;
  required string reference_id = 11;
  required uint64 reference_revision = 12;
  required uint64 world_sequence = 13;
  required uint64 observation_sequence = 14;
}
message EpisodeRequest {
  required uint32 major = 1;
  required bytes request_nonce = 2;
  required uint64 request_sequence = 3;
  required uint32 action = 4; // 1 BEGIN,2 ADVANCE,3 FINISH.
  required string vm = 5;
  required string execution = 6;
  required string app_instance = 7;
  required uint32 control_generation = 8;
  required bytes mission_id = 9;
  required uint64 mission_revision = 10;
  required uint64 expected_grant_revision = 11;
  required uint64 cancel_fence_revision = 12;
  required bytes scene_admission_id = 13;
  required uint64 scene_revision = 14;
  required EpisodeSourceContext source = 15;
  required EpisodeCore candidate = 16;
  required EpisodeProgress progress = 17;
  required uint64 completed_guest_us = 18;
  required uint64 began_guest_us = 19; // BEGIN only;0 on ADVANCE/FINISH across guest clocks.
  required uint64 phase_started_guest_us = 20;
  required uint64 valid_until_pi_us = 21;
  required uint64 clock_probe_sequence = 22;
  required bytes clock_reply_sha256 = 23;
  required uint64 vehicle_sequence = 24;
  required bytes expected_registry_epoch = 25;
  required uint64 expected_registry_revision = 26;
  required bytes expected_episode_id = 27;
  required uint64 expected_episode_revision = 28;
  required bytes phase_state_message_id = 29;
  required uint64 plan_revision = 30;
  required uint64 phase_revision = 31;
  required uint64 calculation_sequence = 32;
  required bytes plan_sha256 = 33;
  optional uint64 stop_command_sequence = 34;
}
message EpisodeReceipt {
  required uint32 major = 1;
  required bytes request_nonce = 2;
  required bytes request_sha256 = 3;
  required uint32 result = 4; // 1 accepted,2 rejected,3 stale,4 unsupported,5 exhausted.
  required uint32 reason = 5;
  required bytes registry_epoch = 6;
  required uint64 registry_revision = 7;
  optional EpisodeSnapshot snapshot = 8;
  required uint64 request_sequence = 9;
}
message EpisodeStatus {
  required uint32 major = 1;
  required uint32 state = 2; // 0 UNKNOWN,1 NONE,2 ACTIVE; never inferred from absence.
  required bytes registry_epoch = 3;
  required uint64 registry_revision = 4;
  required bytes accepted_core_sha256 = 5;
  required bytes episode_id = 6;
  required uint64 episode_revision = 7;
  required uint32 commit_state = 8; // 0 unknown,1 registered/pending state,2 full state admitted.
  required bytes state_message_id = 9;
  required bytes state_sha256 = 10;
  required uint64 state_revision = 11;
  required uint64 plan_revision = 12;
  required uint64 phase_revision = 13;
  required uint64 calculation_hwm = 14;
  required uint64 vehicle_hwm = 15;
  required uint64 valid_until_pi_us = 16;
  optional EpisodeReceipt receipt = 17;
}
// The parent ClockReply.vehicle supplies exact host/device/odom/Pi session,
// calibration, source sample/time and timestamp error at vehicle_sequence.
message PiAbsoluteMeter {
  required bytes meter_epoch = 1;
  required uint64 total_ticks = 2;
  required double metres_per_tick = 3; // Conservative upper m/tick; scale changes replace meter_epoch.
  required uint64 gap_revision = 4;
  required bool valid = 5;
  required uint64 vehicle_sequence = 6;
}
// Ordinary STOP physical facts, distinct from cusp DirectionGateWitness.
// state:0 UNKNOWN,1 SUBMITTED,2 APPLIED,3 fresh STATIONARY. No output permission.
message StopFacts {
  required uint32 state = 1;
  required string pi_session = 2;
  required string device_session = 3;
  required uint64 command_sequence = 4;
  required uint32 control_generation = 5;
  required uint32 producer_role = 6; // 0 Pi-owned safety STOP,1 AUTO,2 MANUAL.
  required bytes source_vm = 7;
  required bytes source_execution = 8;
  required bytes source_app_instance = 9;
  required uint64 calculation_sequence = 10;
  required uint64 counter = 11;
  required uint64 applied_report_sequence = 12;
  required uint64 applied_source_sample = 13;
  required uint64 applied_pi_lower_us = 14;
  required uint64 applied_pi_upper_us = 15;
  required uint64 stationary_first_sequence = 16;
  required uint64 stationary_last_sequence = 17;
  required uint64 stationary_started_pi_us = 18;
  required uint64 stationary_observed_pi_us = 19;
  required uint64 valid_until_pi_us = 20;
  required float left_speed_bound_mps = 21;
  required float right_speed_bound_mps = 22;
  required float yaw_rate_bound_rps = 23;
  required uint64 plan_revision = 24;
  required uint64 phase_revision = 25;
  required bytes mission_id = 26;
  required uint64 mission_revision = 27;
  required uint64 grant_revision = 28;
  required bytes driver_session = 29;
  required uint64 driver_action_seq = 30;
  required uint64 driver_state_seq = 31;
}
message DriveControlFacts {
  required uint32 major = 1;
  required PiAbsoluteMeter meter = 2;
  optional StopFacts stop = 3;
  required uint64 valid_until_pi_us = 4;
}

message LaneGeometry {
  required fixed32 lane_id = 1;
  repeated Point centerline = 2;
  required uint32 travel_direction = 3; // 1: polyline forward only.
  required float position_bound_m = 4;
  required float heading_bound_rad = 5;
  required uint64 revision = 6;
  required fixed32 adjacent_lane_id = 7;
  required bytes point_state = 8; // 0 observed,1 inferred; exactly centerline count.
}
message LaneModel {
  repeated LaneGeometry lanes = 1; // Exactly2, sharing divider station indices.
  repeated Point divider = 2;
  required bytes crossing = 3; // 0 forbidden,1 allowed; divider_count-1.
  required bytes divider_state = 4;
  required uint64 revision = 5;
  required float divider_position_bound_m = 6;
  required float divider_heading_bound_rad = 7;
}
message ParkingSlot {
  required fixed32 slot_id = 1;
  required uint64 geometry_revision = 2;
  required uint32 geometry_state = 3;
  required uint32 occupancy_state = 4;
  repeated Point corners = 5;
  required uint32 entry_edge = 6;
  optional Pose reverse_goal = 7;
  optional Pose forward_goal = 8;
  required float position_bound_m = 9;
  required float heading_bound_rad = 10;
  required uint32 geometry_age_ms = 11;
  required uint32 clearance_age_ms = 12;
  required uint64 evidence_sequence = 13;
  required bool geometry_complete = 14;
  required uint32 occupancy_reason = 15;
  required uint32 source_kinds = 16;
  required uint64 occupancy_revision = 17;
  required float usable_width_m = 18;
  required float usable_depth_m = 19;
  required fixed32 approach_lane_id = 20;
  required uint32 goal_mask = 21;
}
message ParkingSetMeta {
  required uint64 revision = 1;
  required bool complete = 2;
  required uint32 track_count_in_roi = 3;
  required bool capacity_limited = 4;
  required uint64 evidence_sequence = 5;
  required uint32 state = 6;
}
message MapLocalization {
  required uint64 registration_revision = 1;
  required float anchor_position_bound_m = 2;
  required float anchor_heading_bound_rad = 3;
  required float geometry_position_bound_m = 4;
  required float geometry_heading_bound_rad = 5;
  required uint64 observed_mapper_us = 6;
  required uint32 valid_for_us = 7;
  required float position_drift_bound_mps = 8;
  required float heading_drift_bound_rps = 9;
  required uint32 quality = 10; // 1 unique/admitted;0 never enables movement.
  required uint32 timestamp_error_us = 11;
}
message SceneAdmissionRef {
  required bytes admission_id = 1; // Exact UUID16, not an ASCII UUID string.
  required uint64 admission_revision = 2;
  required bytes survey_id = 3;
  required uint64 survey_revision = 4;
  required uint32 policy = 5;
  required bytes coverage_profile_sha256 = 6;
  required bool allow_restore_after_mapper_restart = 7;
}
message MissionExecution {
  required bytes mission_id = 1;
  required uint64 mission_revision = 2;
  required uint32 kind = 3; // 0none,1lane,2parking; no implicit movement permission.
  required uint32 phase = 4;
  required uint32 result = 5;
  required bytes operator_request_nonce = 6;
  optional fixed32 slot_id = 7;
  optional uint64 slot_revision = 8;
  optional Pose goal = 9;
  optional uint64 goal_revision = 10;
  required uint64 mission_deadline_pi_us = 11;
  required uint64 cancel_fence_revision = 12;
  required uint32 active_segment = 13;
  repeated Point selected_slot_polygon = 14;
  optional float goal_position_bound_m = 15;
  optional float goal_heading_bound_rad = 16;
  required bytes scene_admission_id = 17;
  required uint64 scene_admission_revision = 18;
  required uint32 strategy = 19;
  required uint64 execution_deadline_pi_us = 20;
  required uint32 correction_attempts_used = 21;
  required float execution_travel_m = 22;
  required uint64 grant_revision = 23;
  required float search_travel_m = 24;
  required uint64 search_deadline_pi_us = 25;
}
message GearSegment {
  required uint32 first_index = 1;
  required uint32 last_index = 2;
  required sint32 signed_direction = 3;
}
message DirectionGateRef {
  required uint64 gate_revision = 1;
  required uint64 stop_command_sequence = 2;
  required uint32 state = 3;
  required sint32 requested_direction = 4;
}
// Pi-owned STOP/APPLIED + stationary/steering result, never a copied State gate.
// Parent Reply binds the exact VM/execution/app and Pi host/Gateway. The A7 key
// names the original pending transition; serial STOP and VM calculation differ.
message DirectionGateWitness {
  required DirectionGateRef gate = 1;
  required uint32 control_generation = 2;
  required uint32 producer_role = 3; // 1AUTO,2MANUAL
  required uint64 calculation_sequence = 4; // original VM STOP; 0 only Pi/K MANUAL STOP
  required uint64 plan_revision = 5;
  required uint64 phase_revision = 6;
  required uint32 segment_index = 7;
  required uint32 cusp_index = 8;
  required bytes mission_id = 9;
  required uint64 mission_revision = 10;
  required uint64 grant_revision = 11;
  required bytes driver_session = 12;
  required uint64 driver_action_seq = 13;
  required uint64 driver_state_seq = 14;
  required uint64 vehicle_sequence = 15;
  required uint64 valid_until_pi_us = 16;
  required string pi_session = 17;
  required string device_session = 18;
}
message MissionGrant {
  required uint32 major = 1;
  required string vehicle = 2;
  required bytes pi_host_boot = 3;
  required bytes gateway_instance = 4;
  required bytes owner_vm = 5;
  required bytes owner_execution = 6;
  required bytes app_instance = 7;
  required uint32 control_generation = 8;
  required bytes mission_id = 9;
  required uint64 mission_revision = 10;
  required uint64 grant_revision = 11;
  required uint32 kind = 12;
  required uint32 strategy = 13;
  required bytes operator_request_nonce = 14;
  required uint64 issued_pi_us = 15;
  required uint64 mission_deadline_pi_us = 16;
  required uint64 cancel_fence_revision = 17;
  required bytes scene_admission_id = 18;
  required uint64 scene_revision = 19;
  required string configuration = 20;
  required string calibration = 21;
  required bytes primitive = 22;
  required uint64 execution_deadline_pi_us = 23;
  required uint32 correction_attempts_used = 24;
  required float execution_travel_m = 25;
  required float max_execution_travel_m = 26;
  required bool admitted = 27;
  required uint64 search_deadline_pi_us = 28;
  required float search_travel_m = 29;
  required float max_search_travel_m = 30;
  optional bytes locked_goal_sha256 = 31;
}
message MissionBudgetRequest {
  required uint32 major = 1;
  required bytes request_nonce = 2;
  required bytes mission_id = 3;
  required uint64 mission_revision = 4;
  required uint32 control_generation = 5;
  required uint64 expected_grant_revision = 6;
  required uint32 action = 7;
  required fixed32 slot_id = 8;
  required uint64 slot_revision = 9;
  required uint64 goal_revision = 10;
  required uint64 plan_revision = 11;
  required bytes plan_sha256 = 12;
  required bytes selected_goal_sha256 = 13;
  required bytes scene_admission_id = 14;
  required uint64 scene_revision = 15;
  required uint64 completed_guest_us = 16;
  required uint64 valid_until_pi_us = 17;
}
message MissionBudgetReply {
  required uint32 major = 1;
  required bytes request_nonce = 2;
  required bytes request_sha256 = 3;
  required uint32 result = 4;
  required uint32 reason = 5;
  optional MissionGrant grant = 6;
}
message MapperClockProbe {
  required uint32 major = 1;
  required string vehicle = 2;
  required string device = 3;
  required string pi_host_boot = 4;
  required string pi_client_instance = 5;
  required uint64 probe_seq = 6;
  required bytes nonce = 7; // Appendix A6's nonce16 denotes exact16 bytes.
  required uint64 pi_send_us = 8;
  optional string expected_mapper_boot = 9;
  optional string expected_mapper_instance = 10;
  optional string expected_clock_epoch = 11;
  required uint64 admission_revision = 12;
  // Pi clock owner returns a previously accepted immutable J/Pi lease.
  // This is absent during initial probes; it does not report the current P4.
  optional WorldTrust mapper_trust = 13;
}
message MapperClockReply {
  required uint32 major = 1;
  required string pi_host_boot = 2;
  required string pi_client_instance = 3;
  required uint64 probe_seq = 4;
  required bytes nonce = 5;
  required uint64 pi_send_us = 6;
  required string device = 7;
  required string mapper_boot = 8;
  required string mapper_instance = 9;
  required string clock_epoch = 10;
