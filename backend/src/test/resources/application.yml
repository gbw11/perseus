spring:
  datasource:
    url: jdbc:h2:mem:perseus-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  jackson:
    property-naming-strategy: SNAKE_CASE

management:
  endpoints:
    web:
      exposure:
        include: health,info

perseus:
  auth:
    jwt-secret: perseus-test-secret-with-at-least-thirty-two-bytes
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    refresh-cookie-secure: false
    max-login-attempts: 5
    login-attempt-window: 5m
  template-catalog:
    templates:
      - template-id: debian
        version: "12"
        display-name: Debian 12
        min-memory-mib: 128
      - template-id: ubuntu
        version: "24.04"
        display-name: Ubuntu 24.04
        min-memory-mib: 512
  agent:
    stale-after: 15s
    offline-after: 30s
  event:
    # Tests call AgentStatusWatcher.check() and VmStateWatcher.check() themselves.
    agent-status-check-interval-ms: 3600000
    vm-state-check-interval-ms: 3600000
  report:
    os-evidence:
      required-os-ids:
        - debian
        - ubuntu
        - alpine
      observation-window: 30s
      build-id: test-build
  mqtt:
    enabled: false
    broker-url: tcp://127.0.0.1:1883
    client-id: perseus-backend-test
    reconnect-interval: 1s
  dom0-manager:
    base-url: http://127.0.0.1:18081
    service-token: test-service-token
    connect-timeout: 1s
    query-timeout: 2s
    command-timeout: 3s
    retry-backoff: 10ms
