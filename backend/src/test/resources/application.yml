spring:
  datasource:
    url: jdbc:h2:mem:perseus-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  jackson:
    property-naming-strategy: SNAKE_CASE

management:
  endpoints:
    web:
      exposure:
        include: health,info

perseus:
  auth:
    jwt-secret: perseus-test-secret-with-at-least-thirty-two-bytes
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    refresh-cookie-secure: false
    max-login-attempts: 5
    login-attempt-window: 5m
  dom0-manager:
    base-url: http://127.0.0.1:18081
    service-token: test-service-token
    connect-timeout: 1s
    query-timeout: 2s
    command-timeout: 3s
