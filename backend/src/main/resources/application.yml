spring:
  application:
    name: xenova-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/xenova?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:xenova}
    password: ${DB_PASSWORD:xenova}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: ${REDIS_TIMEOUT:2s}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}

xenova:
  auth:
    state-store: ${AUTH_STATE_STORE:redis}
    jwt-secret: ${JWT_SECRET:xenova-local-development-secret-change-before-production}
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:7d}
    refresh-cookie-secure: ${AUTH_COOKIE_SECURE:false}
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    login-attempt-window: ${LOGIN_ATTEMPT_WINDOW:5m}
  # 플랫폼 공개 카탈로그 키를 그대로 사용한다. dom0-manager는 ID나 버전을 변환하지 않는다.
  # - guest-kind가 zephyr인 템플릿은 에이전트·네트워크·정상 종료가 없는 콘솔 전용 펌웨어다.
  template-catalog:
    templates:
      - template-id: ubuntu-24.04-arm64
        version: "1.0.2"
        display-name: Ubuntu 24.04
        min-memory-mib: 512
        guest-kind: linux
      - template-id: debian-13-arm64
        version: "1.0.2"
        display-name: Debian 13
        min-memory-mib: 256
        guest-kind: linux
      - template-id: zephyr-xenvm-starter-arm64
        version: "1.1.0"
        display-name: Zephyr Network Starter 1.1.0
        # 플랫폼 Network Starter 1.1.0은 1 vCPU / 16MiB 고정 프로필이다.
        min-memory-mib: 16
        guest-kind: zephyr
  agent:
    stale-after: ${AGENT_STALE_AFTER:15s}
    offline-after: ${AGENT_OFFLINE_AFTER:30s}
  # 에이전트 상태(ONLINE/STALE/OFFLINE) 변화를 이벤트로 남기기 위해 확인하는 주기
  event:
    agent-status-check-interval-ms: ${EVENT_AGENT_STATUS_CHECK_INTERVAL_MS:5000}
    # 사용자 조작 없이 바뀐 VM 상태(크래시 등)를 찾으려고 dom0-manager 목록을 조회하는 주기
    vm-state-check-interval-ms: ${EVENT_VM_STATE_CHECK_INTERVAL_MS:5000}
  report:
    os-evidence:
      # 에이전트 보고로 증명할 수 있는 Linux만 필수로 둔다. Zephyr는 에이전트가 없어 판정 방법 미정이다.
      required-os-ids:
        - debian
        - ubuntu
      observation-window: ${OS_EVIDENCE_WINDOW:30s}
      build-id: ${BUILD_ID:}
  mqtt:
    enabled: ${MQTT_ENABLED:true}
    broker-url: ${MQTT_BROKER_URL:tcp://127.0.0.1:1883}
    client-id: ${MQTT_CLIENT_ID:xenova-backend}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    reconnect-interval: ${MQTT_RECONNECT_INTERVAL:5s}
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:*}
  # dom0 표시 서비스가 WS /ws/v1/display-service 첫 프레임으로 보내는 공유 비밀. 비어 있으면 연결을 모두 거부(4401)한다.
  display:
    enabled: ${DISPLAY_FEED_ENABLED:false}
    base-url: ${DISPLAY_FEED_BASE_URL:http://127.0.0.1:8082}
    # WS 표시 서비스와 기존 feed 클라이언트가 같은 토큰을 사용한다. 기존 환경변수도 유지한다.
    service-token: ${XENOVA_DISPLAY_SERVICE_TOKEN:${DISPLAY_FEED_SERVICE_TOKEN:}}
  dom0-manager:
    base-url: ${DOM0_MANAGER_BASE_URL:http://127.0.0.1:8081}
    service-token: ${DOM0_MANAGER_SERVICE_TOKEN:}
    connect-timeout: ${DOM0_MANAGER_CONNECT_TIMEOUT:2s}
    query-timeout: ${DOM0_MANAGER_QUERY_TIMEOUT:6s}
    # Keep long-running VM commands connected for up to 15 minutes.
    command-timeout: ${DOM0_MANAGER_COMMAND_TIMEOUT:15m}
    retry-backoff: ${DOM0_MANAGER_RETRY_BACKOFF:500ms}
  vm-registration:
    # Platform registration sender authentication; separate from user JWT and dom0-manager credentials.
    service-token: ${VM_REGISTRATION_SERVICE_TOKEN:}
