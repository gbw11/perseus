spring:
  application:
    name: perseus-backend
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/perseus;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

perseus:
  auth:
    jwt-secret: ${JWT_SECRET:perseus-local-development-secret-change-before-production}
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:7d}
    refresh-cookie-secure: ${AUTH_COOKIE_SECURE:false}
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    login-attempt-window: ${LOGIN_ATTEMPT_WINDOW:5m}
  # 1차 템플릿 목록. 버전과 최소 메모리는 P2 확인 전 임시값이다.
  template-catalog:
    templates:
      - template-id: alpine
        version: "1.2.0"
        display-name: Alpine 1.2.0
        min-memory-mib: 128
      - template-id: debian
        version: "12"
        display-name: Debian 12
        min-memory-mib: 256
      - template-id: ubuntu
        version: "24.04"
        display-name: Ubuntu 24.04
        min-memory-mib: 512
  agent:
    stale-after: ${AGENT_STALE_AFTER:15s}
    offline-after: ${AGENT_OFFLINE_AFTER:30s}
  report:
    os-evidence:
      required-os-ids:
        - debian
        - ubuntu
        - alpine
      observation-window: ${OS_EVIDENCE_WINDOW:30s}
      build-id: ${BUILD_ID:}
  mqtt:
    enabled: ${MQTT_ENABLED:true}
    broker-url: ${MQTT_BROKER_URL:tcp://127.0.0.1:1883}
    client-id: ${MQTT_CLIENT_ID:perseus-backend}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    reconnect-interval: ${MQTT_RECONNECT_INTERVAL:5s}
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:*}
  dom0-manager:
    base-url: ${DOM0_MANAGER_BASE_URL:http://127.0.0.1:8081}
    service-token: ${DOM0_MANAGER_SERVICE_TOKEN:}
    connect-timeout: ${DOM0_MANAGER_CONNECT_TIMEOUT:2s}
    query-timeout: ${DOM0_MANAGER_QUERY_TIMEOUT:6s}
    command-timeout: ${DOM0_MANAGER_COMMAND_TIMEOUT:35s}
    retry-backoff: ${DOM0_MANAGER_RETRY_BACKOFF:500ms}
