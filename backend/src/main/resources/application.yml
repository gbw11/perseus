spring:
  application:
    name: perseus-backend
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/perseus;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

perseus:
  auth:
    jwt-secret: ${JWT_SECRET:perseus-local-development-secret-change-before-production}
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:7d}
    refresh-cookie-secure: ${AUTH_COOKIE_SECURE:false}
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    login-attempt-window: ${LOGIN_ATTEMPT_WINDOW:5m}
