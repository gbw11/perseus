name: xenova-ci

services:
  jenkins:
    build:
      context: ./deploy/jenkins
      dockerfile: Dockerfile
    image: xenova-jenkins:lts-jdk21
    restart: unless-stopped
    group_add:
      - ${DOCKER_GID:?DOCKER_GID is required}
    environment:
      JAVA_OPTS: -Xms512m -Xmx2g -Djava.awt.headless=true
      JENKINS_OPTS: --prefix=/jenkins
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 127.0.0.1:${JENKINS_HTTP_PORT:-8080}:8080
    networks:
      default:
      xenova-app:
        aliases:
          - jenkins
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/jenkins/login"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    cpus: 2.0
    mem_limit: 3g

volumes:
  jenkins-home:

networks:
  xenova-app:
    external: true
    name: xenova_app
