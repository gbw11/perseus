openapi: 3.1.0
info:
  title: Xenova dom0 manager API
  version: 1.0.0
  description: >-
    Spring Boot 관리 서버와 Python dom0-manager 사이의 내부 계약.
    기준 문서는 docs/contracts/vm-api-contract-v1.md 이며, 이 파일은 그 문서의 기계 판독용 원본이다.
    서비스는 보드의 Tailscale 주소에 바인딩하고 모든 엔드포인트에서 Bearer 서비스 토큰을 검사한다.
    Spring 이 발급한 vm_id 를 플랫폼 registry 와 Xen UUID의 영구 식별자로 사용한다.
    FastAPI 기본 422(HTTPValidationError)는 400 InvalidArgument 로 정규화하고, 생성 스키마에서
    422 응답과 HTTPValidationError 모델을 제거해야 이 파일과의 차이 검사가 통과한다.
servers:
  - url: http://{tailscale_address}:8081
    description: dom0 Tailscale address
    variables:
      tailscale_address:
        default: 100.64.0.1
security:
  - ServiceToken: []
tags:
  - name: VMs
  - name: Health
paths:
  /api/v1/vms:
    get:
      tags: [VMs]
      operationId: listVms
      summary: Xen 에 존재하는 도메인 목록
      description: >-
        Xen 에 현재 존재하는 도메인만 반환한다. 종료된 VM 을 포함한 전체 목록은
        Spring 이 자기 레코드와 조합해 만든다.
      x-driver-timeout-seconds: 5
      responses:
        '200':
          description: VM 배열
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vm'
    post:
      tags: [VMs]
      operationId: createVm
      summary: VM 생성 또는 재시작
      description: >-
        vm_id 의 디스크가 있으면 재사용하고 없으면 template_id/template_version 으로 새로 만든다.
        디스크 경로는 vm_id 에서 파생한다. 꺼진 VM 의 재시작은 같은 vm_id 로 이 엔드포인트를
        다시 호출하는 것이며 별도 start 엔드포인트는 없다.
        Spring 불변조건: 같은 vm_id 에는 항상 같은 생성 명세를 보낸다.
        동일 vm_id/명세 재요청은 기존 결과를 반환하고 다른 명세는 409 로 거부한다.
        Linux IP 는 플랫폼 전역 잠금 안에서 자동 할당한다.
      x-driver-timeout-seconds: 30
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVmRequest'
      responses:
        '201':
          description: 도메인 생성됨 (state 는 running)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '409':
          $ref: '#/components/responses/VMExists'
        '507':
          $ref: '#/components/responses/InsufficientResources'
  /api/v1/vms/{vm_id}:
    parameters:
      - $ref: '#/components/parameters/VmId'
    get:
      tags: [VMs]
      operationId: getVm
      summary: VM 단건 조회
      x-driver-timeout-seconds: 5
      responses:
        '200':
          description: VM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
        '404':
          $ref: '#/components/responses/VMNotFound'
    delete:
      tags: [VMs]
      operationId: deleteVm
      summary: 정지된 VM 숨김 보관
      description: >-
        실행 중인 VM 은 409 로 거부한다. 정지된 VM 은 retire 생명주기로 숨김 보관하며
        tombstone 과 generation 을 유지한다. 같은 디스크를 restore 하면 기존 vm_id 를 유지한다.
      x-driver-timeout-seconds: 90
      responses:
        '204':
          description: VM 이 숨김 보관됨
        '404':
          $ref: '#/components/responses/VMNotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
  /api/v1/vms/{vm_id}/stop:
    parameters:
      - $ref: '#/components/parameters/VmId'
    post:
      tags: [VMs]
      operationId: stopVm
      summary: 정상 종료 (디스크 보존)
      description: >-
        xl shutdown 으로 graceful shutdown 을 요청하고 도메인이 소멸할 때까지 기다린다.
        디스크는 보존되므로 같은 vm_id 로 POST /api/v1/vms 를 호출하면 재시작된다.
        멱등성은 목표 상태 기준이다. 없는 VM 에 대한 호출도 204 다.
        호출은 동기 방식이며 최대 90초까지 소멸을 기다린다. 일반 stop 은 시간 초과 시
        자동으로 강제 종료하지 않는다. 강제 종료는 명시적인 force 정책에서만 수행한다.
      x-driver-timeout-seconds: 90
      responses:
        '204':
          description: 도메인이 없는 상태 (디스크 보존)
  /healthz:
    get:
      tags: [Health]
      operationId: healthz
      summary: dom0-manager 와 Xen 응답 여부
      description: >-
        dom0-manager 프로세스는 살아 있지만 Xen(xl) 이 응답하지 않는 상황을 구분한다.
        Spring 이 dom0-manager 접속 상태를 판단할 때 쓴다 (자동 복구 주체는 계약 13장 미확정).
      x-driver-timeout-seconds: 5
      responses:
        '200':
          description: dom0-manager 와 Xen 모두 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Xen 이 응답하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  securitySchemes:
    ServiceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque service token
  parameters:
    VmId:
      name: vm_id
      in: path
      required: true
      description: >-
        Spring 이 생성하는 불변 UUID. Xen 도메인에서 역조회할 수 있어야 한다
        (도메인 설정의 uuid 에 기록하고 xl list -l 의 config.c_info.uuid 로 역조회. 계약 13장).
      schema:
        type: string
        format: uuid
  schemas:
    VmState:
      type: string
      description: >-
        전부 xl list 에서 읽히는 실제 Xen 상태다. API 가 만드는 상태는 running 뿐이고 나머지는
        조회로만 관찰된다. 매핑: r,b → running / s,d → stopping / p → paused / c → crashed.
        b(blocked) 는 I/O 대기 중인 정상 상태이며 장애가 아니다. "꺼짐"은 도메인의 부재다.
      enum: [running, stopping, paused, crashed]
    Vm:
      type: object
      description: >-
        Xen 에서 직접 읽히는 필드만 담는다. name, template_id, template_version 은 Spring 이 보유한다.
      additionalProperties: false
      required: [vm_id, state, vcpus, memory_mib]
      properties:
        vm_id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/VmState'
        vcpus:
          type: integer
          minimum: 1
        memory_mib:
          type: integer
          minimum: 1
    CreateVmRequest:
      type: object
      description: >-
        name 은 Spring 이 단독으로 검증·보유하므로 보내지 않는다. 템플릿별 min_memory_mib 하한은
        Spring 이 검사하고, dom0-manager 는 공통 범위만 검사한다.
      additionalProperties: false
      required: [vm_id, template_id, template_version, vcpus, memory_mib]
      properties:
        vm_id:
          type: string
          format: uuid
          description: Spring 이 한 번 생성해 재시도에도 재사용한다
        template_id:
          type: string
          minLength: 1
          description: 예 ubuntu, debian, zephyr
        template_version:
          type: string
          minLength: 1
        vcpus:
          type: integer
          minimum: 1
          maximum: 4
        memory_mib:
          type: integer
          minimum: 128
          maximum: 1024
          description: 배수 제약 없음. 64 단위는 화면 입력 규칙일 뿐이다
    ResourceError:
      type: object
      additionalProperties: false
      required: [name, requested, available]
      properties:
        name:
          type: string
          enum: [vcpus, memory_mib]
        requested:
          type: integer
        available:
          type: integer
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            InvalidState 는 실행 중인 VM 을 DELETE 할 때 반환한다 (409, 계약 4.4).
            분류되지 않은 실패의 500 DriverError 는 아직 이 목록에 없다 (계약 8.1·13장).
          enum:
            - InvalidArgument
            - VMNotFound
            - VMExists
            - InsufficientResources
            - InvalidState
        message:
          type: string
        detail:
          type: [string, 'null']
          description: 백엔드 로그용 Xen 상세. 프론트에 노출하지 않는다
        resource:
          oneOf:
            - $ref: '#/components/schemas/ResourceError'
            - type: 'null'
          description: InsufficientResources 에만 있다
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, xen_unavailable]
  responses:
    InvalidArgument:
      description: 형식 또는 범위 오류 (FastAPI 422 를 400 으로 정규화)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    VMNotFound:
      description: 대상 도메인이 Xen 에 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    VMExists:
      description: vm_id 충돌 (단일 의미). 표시 이름 중복은 Spring 이 판정한다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidState:
      description: 현재 VM 생명주기에서 요청을 수행할 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InsufficientResources:
      description: xl info 의 free_memory 기준 가용 자원 부족. resource 에 name/requested/available
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
