openapi: 3.1.0
info:
  title: Xenova dom0 manager API
  version: 1.0.0
  description: >-
    Spring 요청 DTO와 Xenova 공통 Manager를 연결하는 내부 HTTP 계약의 생성/조회 모델.
    현재 관리 규칙은 docs/build-guides/xenova-vm-management.md 를 따른다.
    UUID는 Spring이 발급하며 플랫폼의 영구 registry/journal에서 멱등성을 판정한다.
    HTTP 어댑터 구현과 제어/삭제 엔드포인트의 연결은 이 문서만으로 완료되지 않는다.
servers:
  - url: http://127.0.0.1:8081
    description: dom0 localhost
tags:
  - name: VMs
  - name: Health
paths:
  /api/v1/vms:
    get:
      tags: [VMs]
      operationId: listVms
      summary: 등록된 VM 목록
      description: >-
        영구 등록된 VM을 정지 상태까지 포함해 반환한다. 보관/삭제 이력은 공통 관리 필터로 조회한다.
      x-driver-timeout-seconds: 5
      responses:
        '200':
          description: VM 배열
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vm'
    post:
      tags: [VMs]
      operationId: createVm
      summary: 정지 VM 등록
      description: >-
        외부 vm_id를 영구 UUID와 Xen UUID로 그대로 사용한다. 표시 이름은 경로와 분리한다.
        같은 UUID/최초 명세는 기존 작업과 현재 설정을 반환하고 다른 명세는 충돌이다.
        Linux IP는 플랫폼이 잠금 안에서 예약한다. Zephyr ipv4는 null이다.
        생성은 실행과 분리하며 보관/삭제된 UUID를 되살리지 않는다.
      x-driver-timeout-seconds: 30
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVmRequest'
      responses:
        '200':
          description: 동일 UUID·최초 명세의 재전달
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
        '201':
          description: 정지 인스턴스 등록됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '409':
          $ref: '#/components/responses/VMExists'
        '507':
          $ref: '#/components/responses/InsufficientResources'
  /api/v1/vms/{vm_id}:
    parameters:
      - $ref: '#/components/parameters/VmId'
    get:
      tags: [VMs]
      operationId: getVm
      summary: VM 단건 조회
      x-driver-timeout-seconds: 5
      responses:
        '200':
          description: VM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
        '404':
          $ref: '#/components/responses/VMNotFound'
    delete:
      tags: [VMs]
      operationId: deleteVm
      summary: VM 삭제 요청 (공통 retire/purge 정책과 별도 매핑 필요)
      description: >-
        공통 delete는 정지 VM 보관(retire)이며 purge는 별도 승인/세대/작업 키가 필요하다.
        이 엔드포인트를 자동 강제 종료·영구 삭제로 연결하지 않는다.
      x-driver-timeout-seconds: 30
      responses:
        '204':
          description: 도메인과 디스크가 모두 없는 상태
  /api/v1/vms/{vm_id}/stop:
    parameters:
      - $ref: '#/components/parameters/VmId'
    post:
      tags: [VMs]
      operationId: stopVm
      summary: 정상 종료 (디스크 보존)
      description: >-
        현재 공통 stop은 최대 90초 동안 도메인 제거를 동기 확인하고 Linux를 자동 강제 종료하지 않는다.
        Zephyr 개별 종료는 명시적 force가 필요하다. HTTP 성공 본문/타임아웃 연결은
        docs/dom0-backend-http-contract-v1.md 의 현재 코드 차이를 함께 확인한다.
      x-driver-timeout-seconds: 30
      responses:
        '204':
          description: 도메인이 없는 상태 (디스크 보존)
  /healthz:
    get:
      tags: [Health]
      operationId: healthz
      summary: dom0-manager 와 Xen 응답 여부
      description: >-
        dom0-manager 프로세스는 살아 있지만 Xen(xl) 이 응답하지 않는 상황을 구분한다.
        2차 RecoveryService 가 사용한다.
      x-driver-timeout-seconds: 5
      responses:
        '200':
          description: dom0-manager 와 Xen 모두 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Xen 이 응답하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  parameters:
    VmId:
      name: vm_id
      in: path
      required: true
      description: >-
        Spring 이 생성하는 불변 UUID. registry.uuid 및 Xen 설정 uuid와 같은 값이다.
      schema:
        type: string
        format: uuid
  schemas:
    VmState:
      type: string
      description: >-
        HTTP 축약 상태다. 공통 Manager의 xen_state와 앱 준비 unknown은 별개로 유지한다.
        blocked는 running, dying은 stopping, 도메인 부재는 shutdown으로 매핑한다.
        blocked는 정상 I/O 대기이며 장애나 복구 사유가 아니다.
      enum: [running, stopping, shutdown, paused, crashed]
    Vm:
      type: object
      description: >-
        영구 설정과 생성 출처 및 Xen 관측을 연결한 VM이다. IP는 배정 주소이며 실제 획득 증거가 아니다.
      additionalProperties: false
      required: [vm_id, name, state, template_id, template_version, guest_kind, vcpus, memory_mib, ipv4]
      properties:
        vm_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 63
        template_id:
          type: [string, 'null']
        template_version:
          type: [string, 'null']
        guest_kind:
          type: string
          enum: [linux, zephyr]
        ipv4:
          type: [string, 'null']
          description: Linux 배정 주소. Zephyr는 null
        state:
          $ref: '#/components/schemas/VmState'
        vcpus:
          type: integer
          minimum: 1
        memory_mib:
          type: integer
          minimum: 1
    CreateVmRequest:
      type: object
      description: >-
        정확한 공개 카탈로그 ID·버전과 표시 이름을 전달한다. guest_kind는 카탈로그에서,
        Linux IP는 플랫폼에서 결정한다. 외부 idempotency_key는 요구하지 않는다.
      additionalProperties: false
      required: [vm_id, name, template_id, template_version, vcpus, memory_mib]
      properties:
        vm_id:
          type: string
          format: uuid
          description: Spring 이 한 번 생성해 재시도에도 재사용한다
        name:
          type: string
          minLength: 1
          maxLength: 63
          description: 한글·공백을 포함하는 표시 이름. 경로/Xen 이름으로 사용하지 않는다
        template_id:
          type: string
          minLength: 1
          description: ubuntu-24.04-arm64 / debian-13-arm64 / zephyr-xenvm-starter-arm64
        template_version:
          type: string
          minLength: 1
        vcpus:
          type: integer
          minimum: 1
          maximum: 4
        memory_mib:
          type: integer
          minimum: 16
          maximum: 8192
          description: Linux 128..8192, Zephyr 16 고정. 카탈로그에서 종류별 최종 검사
    ResourceError:
      type: object
      additionalProperties: false
      required: [name, requested, available]
      properties:
        name:
          type: string
          enum: [vcpus, memory_mib]
        requested:
          type: integer
        available:
          type: integer
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            InvalidState 는 보관/삭제 UUID의 create 또는 수명주기 충돌을 포함한다.
          enum:
            - InvalidArgument
            - VMNotFound
            - VMExists
            - InsufficientResources
            - InvalidState
        message:
          type: string
        detail:
          type: [string, 'null']
          description: 백엔드 로그용 Xen 상세. 프론트에 노출하지 않는다
        resource:
          oneOf:
            - $ref: '#/components/schemas/ResourceError'
            - type: 'null'
          description: InsufficientResources 에만 있다
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, xen_unavailable]
  responses:
    InvalidArgument:
      description: 형식 또는 범위 오류 (FastAPI 422 를 400 으로 정규화)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    VMNotFound:
      description: 대상 도메인이 Xen 에 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    VMExists:
      description: vm_id 충돌 (단일 의미). 표시 이름 중복은 Spring 이 판정한다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InsufficientResources:
      description: IP 풀 고갈 또는 저장공간 등 자원 부족. resource는 선택 정보다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
