# One disposable Xen Arm64 test guest. Requires guest-capable kernel Image.
name = "perseus-test"
type = "pvh"
memory = 256
vcpus = 1
kernel = "/opt/perseus/bringup/Image"
ramdisk = "/opt/perseus/bringup/domU-initramfs.cpio.gz"
extra = "console=hvc0 rdinit=/init loglevel=7"
vif = [ 'mac=02:16:3e:20:00:01,bridge=xenbr0,script=vif-bridge' ]
on_crash = "preserve"
