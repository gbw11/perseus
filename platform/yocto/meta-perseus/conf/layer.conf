# Perseus project-specific Yocto layer

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "perseus"
BBFILE_PATTERN_perseus = "^${LAYERDIR}/"
BBFILE_PRIORITY_perseus = "8"

LAYERSERIES_COMPAT_perseus = "wrynose"
