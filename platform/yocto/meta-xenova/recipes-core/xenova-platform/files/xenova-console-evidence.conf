[Service]
# Existing xenconsoled remains the only PV ring reader. The recipe patch filters
# the logfile only; PTY/UART forwarding and console login remain unchanged.
Environment=XENCONSOLED_TRACE=none
Environment=XENCONSOLED_LOG_DIR=/run/xenova-console-evidence
Environment=XENOVA_CONSOLE_EVIDENCE=1
RuntimeDirectory=xenova-console-evidence
RuntimeDirectoryMode=0700
EnvironmentFile=-/run/xenova-console-evidence/enable.env
# Failure leaves the original none logging mode. The single reader still starts.
ExecStartPre=-/usr/sbin/xenova-telemetry-support console-environment
