# Xenova project-specific Yocto layer

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "xenova"
BBFILE_PATTERN_xenova = "^${LAYERDIR}/"
BBFILE_PRIORITY_xenova = "8"

LAYERSERIES_COMPAT_xenova = "wrynose"

# Fixed official ARM64 fallback: the locked upstream 1.94.2 predates TS-2026-013.
PREFERRED_VERSION_tailscale = "1.104.2"
