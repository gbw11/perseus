[Unit]
# The broker needs only the internal bridge and persistent data, not external online access.
Requires=xenova-bridge.service
After=xenova-bridge.service srv-xenova.mount network.target
After=xenova-first-boot.service
RequiresMountsFor=/srv/xenova
ConditionPathExists=/srv/xenova/mqtt

[Service]
ExecStartPre=+/usr/sbin/xenova-broker check --runtime
ExecStart=
ExecStart=/usr/sbin/mosquitto -c /etc/xenova/mqtt/mosquitto.conf
UMask=0077
RestartSec=3s
TimeoutStartSec=20s
TimeoutStopSec=20s
