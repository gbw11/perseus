# Xenova dom0. Authentication material is generated on this board, never in an image.
per_listener_settings false
allow_anonymous false
include_dir /srv/xenova/mqtt/current/config.d
persistence false
max_packet_size 66560
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages false

listener 1883 127.0.0.1
listener 1883 192.168.77.1
# Optional operator-owned listeners; no management LAN or Tailnet port is opened by default.
include_dir /etc/xenova/mqtt/conf.d
