[Unit]
# No network-online or reverse dependency from Xenova/VM services.
RequiresMountsFor=/srv/xenova
BindsTo=srv-xenova.mount
After=srv-xenova.mount
AssertPathIsMountPoint=/srv/xenova

[Service]
# Keep every persistent daemon file on the verified data partition.
StateDirectory=
UMask=0077
ExecStartPre=/usr/sbin/xenova-tailscale-state prepare
ExecStart=
ExecStart=/usr/sbin/tailscaled $FLAGS --statedir=/srv/xenova/tailscale --state=/srv/xenova/tailscale/tailscaled.state --socket=/run/tailscale/tailscaled.sock --port=${PORT}
ExecStopPost=
ExecStopPost=/usr/sbin/xenova-tailscale-state cleanup
TimeoutStartSec=20s
TimeoutStopSec=20s
