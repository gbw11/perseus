# Isolated only: eth0 is NOT enslaved to this bridge; no Internet forwarding.
port=0
interface=xenbr0
bind-dynamic
dhcp-range=192.168.77.100,192.168.77.150,255.255.255.0,1h
# No default router advertised: this segment intentionally has no external uplink.
dhcp-option=option:router
dhcp-leasefile=/run/zenova/dnsmasq.leases
dhcp-hostsfile=/run/zenova/dhcp-hosts
log-dhcp
