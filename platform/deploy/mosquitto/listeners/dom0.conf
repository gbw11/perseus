# dom0 용 리스너 초안 (S15P31E110-152 에서 실보드·QEMU 로 확정한다. 아직 검증 안 됨).
# /etc/mosquitto/conf.d/listeners.conf 로 설치한다. 공통 설정(mosquitto.conf·acl)은 로컬과 같은 파일을 쓴다.

# VM 들은 xenbr0 의 dom0 주소로만 접속한다 (에이전트 기본값 XENOVA_AGENT_BROKER_HOST=192.168.77.1).
listener 1883 192.168.77.1

# dom0 안 프로세스(관리 서비스 등)용
listener 1883 127.0.0.1

# 브라우저용 WebSocket. 외부(관리 PC)에서 붙을지, 백엔드가 중계할지는 MQTT 계약 v1.1 결정에 따라 주소를 정한다.
listener 9001 127.0.0.1
protocol websockets
