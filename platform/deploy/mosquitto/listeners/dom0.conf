# dom0 리스너. scripts/dom0-broker.sh install 이 /etc/mosquitto/conf.d/listeners.conf 로 설치한다.
# 공통 설정(mosquitto.conf·acl)은 로컬과 같은 파일을 쓴다.
# 외부 서버(Spring)용 Tailscale 리스너는 보드마다 주소가 달라 여기 두지 않는다.
# 서비스 시작 직전에 `xenova-broker tailscale-listener` 가 conf.d/tailscale.conf 로 만든다.

# VM 들은 xenbr0 의 dom0 주소로만 접속한다 (에이전트 기본값 XENOVA_AGENT_BROKER_HOST=192.168.77.1).
listener 1883 192.168.77.1

# dom0 안 프로세스(Recovery Worker·게이트웨이 등)용
listener 1883 127.0.0.1

# WebSocket 은 dom0 안에서 확인용으로만 연다. 브라우저는 브로커에 직접 붙지 않고 백엔드 중계를 쓴다 (시나리오 D2).
listener 9001 127.0.0.1
protocol websockets
