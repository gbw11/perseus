# Xenova MQTT 브로커 공통 설정.
# 로컬 Docker(local/docker-compose.yml)와 dom0 가 이 파일을 그대로 /etc/mosquitto/mosquitto.conf 로 쓴다.
# 환경마다 다른 것(리스너 주소·포트)은 conf.d/listeners.conf 하나로 나눈다 → ../listeners/
# 계약: docs/contracts/mqtt-contract-v1.md (§1 공통 규칙, §9 보안·ACL)

per_listener_settings false

# 인증: 익명 금지, 계정은 passwd(scripts/make-passwd.sh 가 만든다), 권한은 acl
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# 계약 §1: clean session, 오프라인 큐에 기대지 않는다 → 저장하지 않는다
persistence false

# 계약 §1: 메시지 64 KB 이하. 토픽·헤더 몫으로 1 KB 를 더 둔 패킷 상한
max_packet_size 66560

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

include_dir /etc/mosquitto/conf.d
