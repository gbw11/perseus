[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xenova-display-feed"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["dom0-manager>=0.1.0", "xenova-mqtt>=0.1.0", "paho-mqtt>=2,<3", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["xenova_display*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../../dom0-manager", "../../vm-agent/mqtt-client"]
addopts = "-q"
