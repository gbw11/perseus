# PC 시험 (BOARD=native_sim/native/64): Zephyr 소켓을 호스트 소켓으로 넘긴다 (Native Simulator Offloaded Sockets).
# zephyr samples/net/sockets/echo_server/overlay-nsos.conf 와 같은 설정
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_XENOVA_AUTONOMOUS_BROKER_HOST="127.0.0.1"
CONFIG_XENOVA_AUTONOMOUS_VM_ID="11111111-1111-4111-8111-111111111111"
