# Xen network and shutdown use the one shared runtime session.
CONFIG_TIMER_READS_ITS_FREQUENCY_AT_RUNTIME=y
CONFIG_XENOVA_XENSTORE=y
CONFIG_XEN_GRANT_TABLE=n
CONFIG_XENOVA_RUNTIME=y
CONFIG_XENOVA_NETFRONT=y

# Batch PV-console TX to avoid a hypervisor notification for every 8 bytes.
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=1024

# Report a stack boundary violation; detection does not prevent memory corruption.
CONFIG_STACK_SENTINEL=y
