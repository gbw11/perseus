[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xenova-drive-world"
version = "0.1.0"
description = "Shared bounded drive world protobuf codec"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "python"}
py-modules = ["world_codec"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["xenova_drive_world*"]
namespaces = false
