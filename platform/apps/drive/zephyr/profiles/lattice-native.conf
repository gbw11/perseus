# Host-backed libc for the real native Zephyr kernel test only.
CONFIG_PICOLIBC=n
CONFIG_EXTERNAL_LIBC=y
# Match the fixed ARM candidate's actual tick resolution. Native's 100 Hz
# default rounds each 1-2 ms I/O wait to 10 ms and cannot model this profile's
# existing 20 ms clock/worker budget. Budgets and freshness are unchanged.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
# The frozen TAP driver otherwise polls every 50 ms. An interrupt-driven
# target is not modelled by adding that sleep to each network receive.
CONFIG_ETH_NATIVE_TAP_RX_TIMEOUT=1
