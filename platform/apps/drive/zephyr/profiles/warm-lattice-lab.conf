# Explicit synthetic vehicle/source profile. Not approved vehicle timing/limits.
CONFIG_XENOVA_DRIVE_WARM=y
CONFIG_XENOVA_DRIVE_LATTICE=y
# The fixed minimal libc exports sqrt only. Use the same SDK's picolibc math;
# No new toolchain/version is introduced. The ARM builder advertises the
# cross-toolchain's TLS capability; the native host toolchain has another Kconfig.
CONFIG_PICOLIBC=y
CONFIG_XENOVA_DRIVE_AUTO_PRIORITY=7
CONFIG_XENOVA_DRIVE_RECORDER=n
CONFIG_XENOVA_DIAGNOSTICS_THREADS=n
# Four independent MQTT connections share the pool. One maximum map and one
# maximum state body may be in flight together (64 KiB), plus small control,
# telemetry and packet-fragment overhead. 512 x 256 B is the explicit reserve;
# it is separate from the decoder's immutable map/path storage.
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=32768
CONFIG_NET_PKT_RX_COUNT=96
CONFIG_NET_BUF_RX_COUNT=512
CONFIG_XENOVA_MQTT_TCP_NODELAY=y
