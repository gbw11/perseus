[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dom0-manager"
version = "0.1.0"
description = "Perseus dom0 control service: Spring 관리 서버와 Xen(xl) 사이의 내부 HTTP API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
    "pyyaml>=6",
]

[tool.setuptools.packages.find]
include = ["dom0_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
