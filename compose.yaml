name: xenova

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-_}
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy
      admin-console:
        condition: service_healthy
      vm-screens:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xenova}
      MYSQL_USER: ${MYSQL_USER:-xenova}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: ${TZ:-Asia/Seoul}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: ${TZ:-Asia/Seoul}
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: xenova-backend:${IMAGE_TAG:-local}
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-xenova}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER:-xenova}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      AUTH_STATE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_SSL: "false"
      REDIS_HEALTH_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      MQTT_ENABLED: ${MQTT_ENABLED:-false}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-tcp://host.docker.internal:1883}
      DOM0_MANAGER_BASE_URL: ${DOM0_MANAGER_BASE_URL:-http://host.docker.internal:8081}
      DOM0_MANAGER_SERVICE_TOKEN: ${DOM0_MANAGER_SERVICE_TOKEN:-}
      XENOVA_DISPLAY_SERVICE_TOKEN: ${XENOVA_DISPLAY_SERVICE_TOKEN:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    expose:
      - "8080"
    networks:
      - app
      - data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    stop_grace_period: 30s

  admin-console:
    image: xenova-admin-console:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      target: admin-console
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_SCREENS_ORIGIN: ${VITE_SCREENS_ORIGIN:-/screens}
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  vm-screens:
    image: xenova-vm-screens:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      target: vm-screens
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_TELEMETRY: ${VITE_TELEMETRY:-live}
        VITE_BASE_PATH: /screens/
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql-data:
  redis-data:

networks:
  app:
  data:
    internal: true
